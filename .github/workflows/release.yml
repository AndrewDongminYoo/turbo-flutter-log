name: Release

# Publishing is manual by design: pushing a `v*` tag is the deliberate act.
on:
  push:
    tags:
      - v*

# The job checks out, verifies the tag and publishes to the Marketplace. It never
# writes to the repository, and it is the one job holding the Marketplace PAT.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match package.json version $manifest" >&2
            exit 1
          fi

      - run: pnpm run check-types

      - run: pnpm run lint

      - run: pnpm run test:unit

      - name: Extension host tests
        run: xvfb-run -a pnpm test

      # `vsce` is a devDependency so `pnpm install --frozen-lockfile` installs the version the lockfile
      # pins, with its integrity hash. `npx --yes @vscode/vsce` would instead run
      # whatever is latest on npm at tag-push time, in the one job holding the PAT.
      - name: Publish to the Marketplace
        run: npx vsce publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
