name: CI

on:
  push:
    branches: [main]
  pull_request:

# Without an explicit block, a workflow inherits write-all.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check-types

      - run: npm run lint

      - run: npm run test:unit

      # The extension-host suite launches a real VS Code, which needs a display.
      - name: Extension host tests
        run: xvfb-run -a npm test

      - name: Package
        run: npx --yes @vscode/vsce package --out turbo-flutter-log.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: turbo-flutter-log.vsix
