name: CI

on:
  push:
    branches: [main]
  pull_request:

# Without an explicit block, a workflow inherits write-all.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check-types

      - run: pnpm run lint

      - run: pnpm run test:unit

      # The extension-host suite launches a real VS Code, which needs a display.
      - name: Extension host tests
        run: xvfb-run -a pnpm test

      - name: Package
        run: pnpm run vsce:package --out turbo-flutter-log.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: turbo-flutter-log.vsix
