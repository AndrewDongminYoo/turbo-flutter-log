name: CI

on:
  push:
    branches: [main]
  pull_request:

# Without an explicit block, a workflow inherits write-all.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check-types

      - run: pnpm run lint

      - run: pnpm run test:unit

      # The extension-host suite launches a real VS Code, which needs a display.
      - name: Extension host tests
        run: xvfb-run -a pnpm test

      - name: Package
        run: pnpm run vsce:package --out turbo-flutter-log.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: turbo-flutter-log.vsix
